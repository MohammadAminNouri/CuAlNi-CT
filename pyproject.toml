[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cualni-cryst"
version = "0.2.0"
description = "Transparent crystallographic tools for testing Correspondence Theory, PTMC, and Ball-James/cofactor theory in Cu-Al-Ni martensite."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "sympy>=1.12,<2",
  # Keep the supported pandas range on releases that publish wheels for every
  # Python version in the CI matrix (3.11-3.13). This prevents resolver
  # backtracking into old source-only pandas releases after a transient index
  # failure, while still allowing both the maintained 2.3 line and pandas 3.0.
  "pandas>=2.3.3,<3.1",
]

[project.scripts]
cualni-cryst = "cualni_cryst.__main__:main"
cualni-calpad = "cualni_cryst.calpad:main"
cualni-or = "cualni_cryst.orientation:main"
cualni-crosslock = "cualni_cryst.operator_crosslock:main"
cualni-two = "cualni_cryst.two_phase:main"
cualni-project = "cualni_cryst.project_io:main"

[project.optional-dependencies]
app = ["streamlit>=1.40,<2", "plotly>=5.24,<7", "gemmi>=0.7,<1", "spglib>=2.5,<3"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "hypothesis>=6.100,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: long-running integration/regression tests",
]
