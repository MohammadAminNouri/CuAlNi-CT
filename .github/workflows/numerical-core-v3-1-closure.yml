name: Numerical core V3.1 closure gate

on:
  push:
    branches:
      - "science/universal-validation-recovered"
    paths:
      - "tools/numerical_core_v3_1_closure.py"
      - ".github/workflows/numerical-core-v3-1-closure.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: numerical-core-v3-1-closure-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  install-prove-falsify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout exact submitted revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Record starting state
        run: |
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          git status --porcelain=v1
          git log -1 --oneline

      - name: Generate V3.1 source in isolated Actions working tree
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          python tools/numerical_core_v3_1_closure.py --repo . \
            2>&1 | tee /tmp/v3-installer.log

      - name: Install generated project
        id: deps
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]" 2>&1 | tee /tmp/v3-install-deps.log
          python - <<'PY'
          import mpmath, numpy, scipy, sympy, pytest
          print("mpmath", mpmath.__version__)
          print("numpy", numpy.__version__)
          print("scipy", scipy.__version__)
          print("sympy", sympy.__version__)
          print("pytest", pytest.__version__)
          PY

      - name: Focused equation and oracle proofs
        id: focused
        if: steps.install.outcome == 'success' && steps.deps.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q -vv --durations=40 \
            tests/test_equation_preserving_adaptive_core_v3.py \
            tests/test_engineered_representation_error_ladder.py \
            tests/test_engineered_ct_generalized_vs_whitened.py \
            tests/test_engineered_high_precision_conditioning.py \
            tests/test_engineered_metric_sqrt_stability.py \
            tests/test_engineered_cofactor_ptmc_rankone.py \
            tests/test_engineered_metamorphic.py \
            2>&1 | tee /tmp/v3-focused-tests.log

      - name: Full engineered falsification
        id: engineered
        if: steps.focused.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python tools/run_engineered_falsification_v2.py --profile full \
            2>&1 | tee /tmp/v3-engineered.log

      - name: Frozen scientific hardening regression
        id: frozen
        if: steps.engineered.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python tools/run_science_novel_hardening.py --profile full \
            2>&1 | tee /tmp/v3-frozen-science.log

      - name: Whole repository test suite
        id: whole
        if: steps.frozen.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q --durations=50 2>&1 | tee /tmp/v3-whole-pytest.log

      - name: Collect generated tree and diagnostics
        if: always()
        run: |
          OUT=/tmp/cualni-v3-artifacts
          mkdir -p "$OUT/generated"
          git status --porcelain=v1 > "$OUT/git-status.txt"
          git diff --stat > "$OUT/git-diff-stat.txt" || true
          git diff --no-ext-diff > "$OUT/v3-generated-tracked.diff" || true
          git rev-parse HEAD > "$OUT/input-commit-sha.txt"
          cp /tmp/v3-*.log "$OUT/" 2>/dev/null || true
          cp /tmp/engineered_falsification_v2_report.json "$OUT/" 2>/dev/null || true
          cp /tmp/engineered_representation_error_ladder.json "$OUT/" 2>/dev/null || true
          cp /tmp/engineered_conditioning_sweep.json "$OUT/" 2>/dev/null || true
          cp /tmp/science_novel_hardening_report.json "$OUT/" 2>/dev/null || true
          cp /tmp/equation_preserving_v3_install_manifest.json "$OUT/" 2>/dev/null || true
          if [ -d /tmp/cualni_engineered_failures ]; then
            cp -R /tmp/cualni_engineered_failures "$OUT/"
          fi
          python - <<'PY'
          import json, pathlib, shutil
          manifest = pathlib.Path('/tmp/equation_preserving_v3_install_manifest.json')
          out = pathlib.Path('/tmp/cualni-v3-artifacts/generated')
          if manifest.exists():
              for rel in json.loads(manifest.read_text()):
                  src = pathlib.Path(rel)
                  if src.exists():
                      dst = out / rel
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(src, dst)
          PY
          {
            echo "install=${{ steps.install.outcome }}"
            echo "deps=${{ steps.deps.outcome }}"
            echo "focused=${{ steps.focused.outcome }}"
            echo "engineered=${{ steps.engineered.outcome }}"
            echo "frozen=${{ steps.frozen.outcome }}"
            echo "whole=${{ steps.whole.outcome }}"
          } > "$OUT/gate-outcomes.txt"

      - name: Upload V3.1 diagnostics and generated source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numerical-core-v3-1-${{ github.run_id }}
          path: /tmp/cualni-v3-artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Enforce every scientific gate
        if: always()
        run: |
          failures=0
          for pair in \
            "install:${{ steps.install.outcome }}" \
            "deps:${{ steps.deps.outcome }}" \
            "focused:${{ steps.focused.outcome }}" \
            "engineered:${{ steps.engineered.outcome }}" \
            "frozen:${{ steps.frozen.outcome }}" \
            "whole:${{ steps.whole.outcome }}"
          do
            name=${pair%%:*}
            outcome=${pair#*:}
            if [ "$outcome" != "success" ]; then
              echo "FAILED GATE: $name -> $outcome"
              failures=1
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "No production source will be committed. Inspect the uploaded diagnostics."
            exit 1
          fi
          echo "All V3.1 scientific gates passed."

      - name: Commit generated core only after all gates pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json, subprocess
          paths = sorted(json.load(open('/tmp/equation_preserving_v3_install_manifest.json')))
          if not paths:
              raise SystemExit('empty generated-source manifest')
          subprocess.run(['git', 'add', '--', *paths], check=True)
          print('staging exactly:')
          print('\n'.join(paths))
          PY
          git diff --cached --check
          git status --short
          git diff --cached --quiet && { echo "No generated scientific changes to commit"; exit 1; }
          git commit -m "science: equation-preserving adaptive metric core v3.1"
          git push origin HEAD:science/universal-validation-recovered
