name: Publish validated Phase 2 workstation

on:
  push:
    branches:
      - app/ui-integration-v1
    paths:
      - .github/workflows/app-phase2-install.yml

permissions:
  contents: write

jobs:
  publish-validated-phase2:
    runs-on: ubuntu-latest

    env:
      VALIDATED_COMMIT: a6996996612de5f5cd88823cb3785a062420b3ca
      FROZEN_SCIENCE_BRANCH: freeze/scientific-backend-v3.1-2026-09-24
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout active app branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen scientific engine baseline
        run: |
          git fetch origin "${FROZEN_SCIENCE_BRANCH}"
          git diff --exit-code "origin/${FROZEN_SCIENCE_BRANCH}" -- src/cualni_cryst

      - name: Verify normal CI already includes app dependencies
        run: |
          grep -F 'python -m pip install -e ".[app,dev]"' .github/workflows/tests.yml

      - name: Restore exact already-validated Phase 2 files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          commit = os.environ["VALIDATED_COMMIT"]
          token = os.environ["GH_TOKEN"]

          files = [
              "app/workbench.py",
              "app/ui_components.py",
              "app/streamlit_app.py",
              "tests/app/test_workbench_contract.py",
              "docs/app/PTCLAB_SCOPE_AUDIT.md",
          ]

          for rel in files:
              url = f"https://api.github.com/repos/{repo}/contents/{rel}?ref={commit}"
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github.raw+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  data = response.read()
              path = Path(rel)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              print(f"restored {rel}")
          PY

      - name: Verify exact validated blob identities
        run: |
          python - <<'PY'
          import subprocess

          expected = {
              "app/workbench.py": "6d289767d96554113299f565b634adba4cc652b0",
              "app/ui_components.py": "0298ae96b14fff77c0266d0103785296fd9d887e",
              "app/streamlit_app.py": "7d1fa27ca2727746c6d91da8883ada380b6cb10e",
              "tests/app/test_workbench_contract.py": "4776659dbd72ad5cbc9b343e1c84189988e4e696",
              "docs/app/PTCLAB_SCOPE_AUDIT.md": "3bf8f7acf8f8f9b771e69d48af98f4d2fb5383a0",
          }

          for path, wanted in expected.items():
              actual = subprocess.check_output(
                  ["git", "hash-object", path], text=True
              ).strip()
              if actual != wanted:
                  raise SystemExit(
                      f"{path}: blob mismatch; expected {wanted}, got {actual}"
                  )
              print(f"{path}: {actual} OK")
          PY

      - name: Install app and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[app,dev]"
          python -m pip check

      - name: Compile Phase 2 sources
        run: |
          python -m py_compile \
            app/application.py \
            app/errors.py \
            app/workbench.py \
            app/ui_components.py \
            app/streamlit_app.py \
            tests/app/test_workbench_contract.py

      - name: Run focused Phase 2 tests
        run: |
          python -m pytest -q \