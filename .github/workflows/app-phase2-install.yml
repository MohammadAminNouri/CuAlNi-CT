name: Install Phase 2 scientific workstation

on:
  push:
    branches:
      - app/ui-integration-v1
    paths:
      - .github/workflows/app-phase2-install.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-phase2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-and-verify:
    if: github.ref == 'refs/heads/app/ui-integration-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout active app branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify frozen scientific engine before workstation install
        shell: bash
        run: |
          git fetch origin freeze/scientific-backend-v3.1-2026-09-24
          git diff --exit-code origin/freeze/scientific-backend-v3.1-2026-09-24 -- src/cualni_cryst
          git status --short

      - name: Install Phase 2 workstation package
        shell: python
        run: |
          from __future__ import annotations
          import base64
          import io
          import zipfile
          from pathlib import Path

          payload = ""
          data = base64.b64decode(payload)
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              names = set(archive.namelist())
              expected = {
                  "app/workbench.py",
                  "app/ui_components.py",
                  "app/streamlit_app.py",
                  "tests/app/test_workbench_contract.py",
                  "docs/app/PTCLAB_SCOPE_AUDIT.md",
                  ".github/workflows/tests.yml",
              }
              if names != expected:
                  raise SystemExit(f"Unexpected bundle members: {sorted(names)}")
              for info in archive.infolist():
                  target = (Path.cwd() / info.filename).resolve()
                  if not str(target).startswith(str(Path.cwd().resolve())):
                      raise SystemExit(f"Unsafe bundle path: {info.filename}")
              archive.extractall(Path.cwd())

      - name: Verify application source compiles
        run: |
          python -m py_compile             app/application.py             app/errors.py             app/workbench.py             app/ui_components.py             app/streamlit_app.py             tests/app/test_workbench_contract.py

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[app,dev]"
          python -m pip check

      - name: Run workstation contract tests
        run: |
          python -m pytest -vv tests/app/test_workbench_contract.py tests/app/test_application_contract.py tests/app/test_streamlit_smoke.py

      - name: Run complete repository regression
        run: |
          python -m pytest -q --durations=50

      - name: Run independent final scientific/application readiness gate
        run: |
          python tools/final_scientific_app_readiness.py --report /tmp/phase2_final_readiness.json

      - name: Verify scientific engine unchanged after all tests
        shell: bash
        run: |
          git diff --exit-code origin/freeze/scientific-backend-v3.1-2026-09-24 -- src/cualni_cryst
          if git diff --name-only | grep '^src/cualni_cryst/'; then
            echo "ERROR: Phase 2 attempted to modify frozen scientific files"
            exit 1
          fi

      - name: Verify only intended workstation files changed
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/tests.yml",
              "app/workbench.py",
              "app/ui_components.py",
              "app/streamlit_app.py",
              "tests/app/test_workbench_contract.py",
              "docs/app/PTCLAB_SCOPE_AUDIT.md",
          }

          tracked = set(filter(
              None,
              subprocess.check_output(
                  ["git", "diff", "--name-only"],
                  text=True
              ).splitlines()
          ))

          untracked = set(filter(
              None,
              subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard"],
                  text=True
              ).splitlines()
          ))

          changed = tracked | untracked

          if changed != expected:
              raise SystemExit(
                  f"Unexpected changed files. expected={sorted(expected)} actual={sorted(changed)}"
              )

          print("Validated workstation files:")
          for path in sorted(changed):
              print(path)
          PY

      - name: Commit validated workstation upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             app/workbench.py             app/ui_components.py             app/streamlit_app.py             tests/app/test_workbench_contract.py             docs/app/PTCLAB_SCOPE_AUDIT.md             .github/workflows/tests.yml
          git diff --cached --check
          git commit -m "app: upgrade to phase 2 crystallography workstation"
          git push origin HEAD:app/ui-integration-v1
