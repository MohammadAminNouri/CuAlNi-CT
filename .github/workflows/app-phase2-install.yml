name: Publish Phase 2 files only

on:
  push:
    branches:
      - app/ui-integration-v1
    paths:
      - .github/workflows/app-phase2-install.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      VALIDATED_COMMIT: a6996996612de5f5cd88823cb3785a062420b3ca

    steps:
      - name: Checkout app branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact validated Phase 2 files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          fetch_file() {
            path="$1"
            mkdir -p "$(dirname "$path")"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.raw+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${VALIDATED_COMMIT}" \
              > "$path"
          }

          fetch_file app/workbench.py
          fetch_file app/ui_components.py
          fetch_file app/streamlit_app.py
          fetch_file tests/app/test_workbench_contract.py
          fetch_file docs/app/PTCLAB_SCOPE_AUDIT.md

      - name: Verify exact validated hashes
        shell: bash
        run: |
          set -euo pipefail

          test "$(git hash-object app/workbench.py)" = "6d289767d96554113299f565b634adba4cc652b0"
          test "$(git hash-object app/ui_components.py)" = "0298ae96b14fff77c0266d0103785296fd9d887e"
          test "$(git hash-object app/streamlit_app.py)" = "7d1fa27ca2727746c6d91da8883ada380b6cb10e"
          test "$(git hash-object tests/app/test_workbench_contract.py)" = "4776659dbd72ad5cbc9b343e1c84189988e4e696"
          test "$(git hash-object docs/app/PTCLAB_SCOPE_AUDIT.md)" = "3bf8f7acf8f8f9b771e69d48af98f4d2fb5383a0"

      - name: Commit exact validated Phase 2 files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/workbench.py \
            app/ui_components.py \
            app/streamlit_app.py \
            tests/app/test_workbench_contract.py \
            docs/app/PTCLAB_SCOPE_AUDIT.md

          git diff --cached --check
          git commit -m "app: publish validated phase 2 workstation [skip ci]"
          git push origin HEAD:app/ui-integration-v1