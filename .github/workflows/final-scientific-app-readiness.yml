name: Final scientific and app readiness
# run final readiness against committed V3.1 core

on:
  workflow_dispatch:
  push:
    branches:
      - "science/universal-validation-recovered"
    paths:
      - "tools/final_scientific_app_readiness.py"
      - ".github/workflows/final-scientific-app-readiness.yml"

permissions:
  contents: read

concurrency:
  group: final-scientific-app-readiness-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  final-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Record immutable start state
        run: |
          git rev-parse HEAD | tee /tmp/final-readiness-input-sha.txt
          git status --porcelain=v1 | tee /tmp/final-readiness-start-status.txt

      - name: Install source and verification dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install -e ".[dev]"
          python -m pip install "mpmath>=1.3"
          python -m pip check

      - name: Final independent mathematical/application gate
        id: finalmath
        continue-on-error: true
        run: |
          set -o pipefail
          python tools/final_scientific_app_readiness.py \
            --report /tmp/cualni_final_scientific_app_readiness.json \
            2>&1 | tee /tmp/final-scientific-app-readiness.log

      - name: Full repository regression
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q --durations=50 \
            2>&1 | tee /tmp/final-pytest.log

      - name: Frozen scientific campaign
        id: frozen
        continue-on-error: true
        run: |
          set -o pipefail
          python tools/run_science_novel_hardening.py --profile full \
            2>&1 | tee /tmp/final-frozen-science.log

      - name: Engineered falsification campaign
        id: engineered
        continue-on-error: true
        run: |
          set -o pipefail
          python tools/run_engineered_falsification_v2.py --profile full \
            2>&1 | tee /tmp/final-engineered.log

      - name: CLI smoke on editable install
        id: cli
        continue-on-error: true
        run: |
          set -o pipefail
          cualni-cryst symbolic >/tmp/cualni-symbolic.txt
          cualni-cryst report --out /tmp/cualni-reports
          cualni-calpad --help >/tmp/cualni-calpad-help.txt
          cualni-or --help >/tmp/cualni-or-help.txt
          cualni-crosslock --help >/tmp/cualni-crosslock-help.txt
          cualni-two --help >/tmp/cualni-two-help.txt
          cualni-project --help >/tmp/cualni-project-help.txt
          test -s /tmp/cualni-symbolic.txt
          test -d /tmp/cualni-reports
          find /tmp/cualni-reports -type f -maxdepth 2 -print | tee /tmp/cualni-report-files.txt

      - name: Build wheel and sdist
        id: package
        continue-on-error: true
        run: |
          set -o pipefail
          rm -rf dist build
          python -m build 2>&1 | tee /tmp/final-build.log
          ls -lh dist | tee /tmp/final-dist.txt
          python -m venv /tmp/cualni-wheel-venv
          /tmp/cualni-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/cualni-wheel-venv/bin/python -m pip install dist/*.whl
          /tmp/cualni-wheel-venv/bin/cualni-cryst symbolic \
            >/tmp/cualni-wheel-symbolic.txt
          test -s /tmp/cualni-wheel-symbolic.txt

      - name: Verify repository was not mutated
        id: immutability
        continue-on-error: true
        run: |
          set -o pipefail
          # build artifacts are intentionally untracked; remove them before comparing.
          rm -rf build dist
          CURRENT="$(git status --porcelain=v1)"
          START="$(cat /tmp/final-readiness-start-status.txt)"
          printf '%s\n' "$CURRENT" > /tmp/final-readiness-end-status.txt
          if [ "$CURRENT" != "$START" ]; then
            echo "Repository state changed during final gate"
            diff -u /tmp/final-readiness-start-status.txt /tmp/final-readiness-end-status.txt || true
            exit 1
          fi

      - name: Collect final evidence
        if: always()
        run: |
          OUT=/tmp/cualni-final-readiness-artifact
          mkdir -p "$OUT"
          cp /tmp/cualni_final_scientific_app_readiness.json "$OUT/" 2>/dev/null || true
          cp /tmp/final-*.log "$OUT/" 2>/dev/null || true
          cp /tmp/final-*.txt "$OUT/" 2>/dev/null || true
          cp /tmp/cualni-*.txt "$OUT/" 2>/dev/null || true
          cp /tmp/engineered_falsification_v2_report.json "$OUT/" 2>/dev/null || true
          cp /tmp/engineered_representation_error_ladder.json "$OUT/" 2>/dev/null || true
          cp /tmp/engineered_conditioning_sweep.json "$OUT/" 2>/dev/null || true
          cp /tmp/science_novel_hardening_report.json "$OUT/" 2>/dev/null || true
          {
            echo "finalmath=${{ steps.finalmath.outcome }}"
            echo "pytest=${{ steps.pytest.outcome }}"
            echo "frozen=${{ steps.frozen.outcome }}"
            echo "engineered=${{ steps.engineered.outcome }}"
            echo "cli=${{ steps.cli.outcome }}"
            echo "package=${{ steps.package.outcome }}"
            echo "immutability=${{ steps.immutability.outcome }}"
          } > "$OUT/gate-outcomes.txt"

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-scientific-app-readiness-${{ github.run_id }}
          path: /tmp/cualni-final-readiness-artifact
          if-no-files-found: error
          retention-days: 30

      - name: Enforce final readiness
        if: always()
        run: |
          failures=0
          for pair in \
            "finalmath:${{ steps.finalmath.outcome }}" \
            "pytest:${{ steps.pytest.outcome }}" \
            "frozen:${{ steps.frozen.outcome }}" \
            "engineered:${{ steps.engineered.outcome }}" \
            "cli:${{ steps.cli.outcome }}" \
            "package:${{ steps.package.outcome }}" \
            "immutability:${{ steps.immutability.outcome }}"
          do
            name=${pair%%:*}
            outcome=${pair#*:}
            if [ "$outcome" != "success" ]; then
              echo "FAILED FINAL GATE: $name -> $outcome"
              failures=1
            fi
          done
          if [ "$failures" -ne 0 ]; then
            exit 1
          fi
          echo "FINAL_SCIENTIFIC_APP_READINESS=PASS"
