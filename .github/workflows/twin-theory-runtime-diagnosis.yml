name: Twin theory runtime diagnosis

on:
  push:
    branches:
      - "feature/twin-family-tree-app-v1"
    paths:
      - ".github/workflows/twin-theory-runtime-diagnosis.yml"
      - "twin_app/theory_comparison_ui.py"
      - "twin_app/theory_numerical_ui.py"
      - "tools/profile_twin_theory_runtime.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    name: Default NiTi theoretical comparison timing
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install application
        run: python -m pip install --prefer-binary -e ".[app,dev]"
      - name: Profile isolated backend stages (hard limit)
        run: timeout --signal=TERM --kill-after=8s 420s python -u tools/profile_twin_theory_runtime.py
      - name: Check thesis interpretation and scientific equation explanations
        run: python -m pytest -q --tb=short tests/twin_app/test_theory_comparison_panel_2026.py tests/twin_app/test_theory_scientific_explanations_2026.py

      - name: Click complete theory calculation through hosted Streamlit UI
        run: timeout --signal=TERM --kill-after=8s 250s python -m pytest -q --tb=short tests/twin_app/test_theory_live_button_2026.py
