name: Experimental validation scope guard

on:
  push:
    branches:
      - "next/experimental-validation"
  pull_request:

permissions:
  contents: read

jobs:
  frozen-core-scope:
    # The frozen-core allowlist is only a contract for the explicitly named
    # experimental-validation workstream, not for arbitrary P0/P1 repair PRs.
    # For pull_request, head_ref is the source branch (branches: filters the
    # base branch instead and would silently fail to express this constraint).
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'next/experimental-validation')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen-core scope
        run: |
          python tools/check_experimental_validation_scope.py \
            --base-tag ct-ebsd-reliability-gate-v1 \
            --head HEAD

      - name: Scope-guard self-test
        run: |
          python tools/check_experimental_validation_scope.py --self-test
