name: Twin App hosted Python 3.14 UI smoke

on:
  push:
    branches:
      - "audit/p1-closure-*"
      - "feature/twin-family-tree-app-v1"
  pull_request:
    branches:
      - "feature/twin-family-tree-app-v1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twin-hosted-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hosted-runtime:
    name: Deployed Streamlit entry point · Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install deployed application and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -e ".[app,dev]"
          python -m pip check
      - name: Verify research manifest
        run: python tools/rebuild_twin_manifest.py --check
      - name: Render Twin App and inspect basic UI contracts
        run: |
          python -m pytest -q --tb=short \
            tests/twin_app/test_streamlit_headless_smoke_2026.py \
            tests/twin_app/test_streamlit_166_deployment_ui_2026.py \
            tests/twin_app/test_workspace_navigation_2026.py \
            tests/twin_app/test_habit_evidence_layout_2026.py \
            tests/twin_app/test_correspondence_ui_theme_and_seed_2026.py \
            tests/twin_app/test_tree_correspondence_2026.py \
            tests/twin_app/test_correspondence_cayron_ui.py \
            tests/twin_app/test_metric_design_targets_2026.py
