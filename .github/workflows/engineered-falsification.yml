name: Engineered scientific falsification

on:
  push:
    branches:
      - "science/universal-validation-recovered"
  workflow_dispatch:
    inputs:
      profile:
        description: "Falsification intensity"
        required: true
        default: "full"
        type: choice
        options:
          - quick
          - full
          - torture

permissions:
  contents: read

concurrency:
  group: engineered-falsification-${{ github.ref }}-${{ github.event.inputs.profile || 'full' }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  falsification:
    name: Scientific falsification (${{ github.event.inputs.profile || 'full' }})
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Record revision
        run: |
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          git status --porcelain=v1
          git log -1 --oneline

      - name: Install project and validation dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
          python - <<'PY'
          import sys, numpy, scipy, sympy, pandas, pytest
          print("python", sys.version)
          print("numpy", numpy.__version__)
          print("scipy", scipy.__version__)
          print("sympy", sympy.__version__)
          print("pandas", pandas.__version__)
          print("pytest", pytest.__version__)
          PY

      - name: Run engineered falsification campaign
        id: engineered
        shell: bash
        run: |
          set +e
          PROFILE="${{ github.event.inputs.profile || 'full' }}"
          python tools/run_engineered_falsification_v2.py --profile "$PROFILE"
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Engineered falsification exit code: $CODE"
          exit 0

      - name: Run frozen scientific hardening regression
        id: science
        shell: bash
        run: |
          set +e
          PROFILE="${{ github.event.inputs.profile || 'full' }}"
          if [ "$PROFILE" = "quick" ]; then
            SCIENCE_PROFILE="quick"
          else
            SCIENCE_PROFILE="full"
          fi
          python tools/run_science_novel_hardening.py --profile "$SCIENCE_PROFILE"
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Frozen scientific hardening exit code: $CODE"
          exit 0

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set -u
          OUT="$RUNNER_TEMP/cualni-validation-artifacts"
          mkdir -p "$OUT"

          for f in \
            /tmp/engineered_falsification_v2_report.json \
            /tmp/engineered_conditioning_sweep.json \
            /tmp/engineered_representation_error_ladder.json \
            /tmp/science_novel_hardening_report.json \
            /tmp/science_novel_hardening_quick.log \
            /tmp/science_novel_hardening_full.log
          do
            if [ -f "$f" ]; then
              cp "$f" "$OUT/"
            fi
          done

          if [ -d /tmp/cualni_engineered_failures ]; then
            cp -R /tmp/cualni_engineered_failures "$OUT/"
          fi

          git status --porcelain=v1 > "$OUT/git-status-after.txt"
          git rev-parse HEAD > "$OUT/commit-sha.txt"
          python --version > "$OUT/python-version.txt" 2>&1
          python -m pip freeze > "$OUT/pip-freeze.txt"

          {
            echo "engineered_exit=${{ steps.engineered.outputs.exit_code }}"
            echo "science_exit=${{ steps.science.outputs.exit_code }}"
            echo "profile=${{ github.event.inputs.profile || 'full' }}"
            echo "sha=${GITHUB_SHA}"
          } > "$OUT/run-summary.txt"

          find "$OUT" -maxdepth 3 -type f -print | sort

      - name: Upload scientific diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cualni-scientific-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/cualni-validation-artifacts
          if-no-files-found: warn
          retention-days: 30

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CuAlNi-CT scientific falsification"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- Profile: \`${{ github.event.inputs.profile || 'full' }}\`"
            echo "- Engineered falsification exit: \`${{ steps.engineered.outputs.exit_code }}\`"
            echo "- Frozen scientific hardening exit: \`${{ steps.science.outputs.exit_code }}\`"
            echo "- Diagnostics artifact: \`cualni-scientific-validation-${{ github.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce scientific gate
        if: always()
        shell: bash
        run: |
          E="${{ steps.engineered.outputs.exit_code }}"
          S="${{ steps.science.outputs.exit_code }}"
          if [ -z "$E" ]; then E=99; fi
          if [ -z "$S" ]; then S=99; fi
          if [ "$E" -ne 0 ] || [ "$S" -ne 0 ]; then
            echo "Scientific gate failed: engineered=$E science=$S"
            exit 1
          fi
          echo "Scientific gate passed."
