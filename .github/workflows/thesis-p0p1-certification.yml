name: Thesis P0 P1 crystal-frame and equation certificate

on:
  push:
    branches:
      - feature/twin-family-tree-app-v1
    paths:
      - "twin_app/theory_p0p1_certificate.py"
      - "twin_app/theory_comparison_ui.py"
      - "tests/twin_app/test_theory_p0p1_certificate_2026.py"
      - "docs/THESIS_P0_P1_VERIFICATION_2026.md"
      - ".github/workflows/thesis-p0p1-certification.yml"
  workflow_dispatch:

concurrency:
  group: thesis-p0p1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify source manifest
        run: python tools/rebuild_twin_manifest.py --check
      - name: Install scientific project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -e ".[app,dev]"
      - name: Run independent P0/P1 tests and existing scientific comparators
        run: |
          python -m pytest -q --tb=short --maxfail=1 \
            tests/twin_app/test_theory_p0p1_certificate_2026.py \
            tests/twin_app/test_theory_evidence_2026.py \
            tests/twin_app/test_theory_ptmc_evidence_2026.py \
            tests/twin_app/test_ct_bj_one_way_implication_2026.py \
            tests/twin_app/test_cayron_paper_comparison_2026.py \
            tests/twin_app/test_p0_correspondence_rebasis_2026.py \
            tests/test_cofactor.py
