name: Install Phase 1 public workbench

on:
  push:
    branches:
      - app/ui-integration-v1
    paths:
      - .github/workflows/app-phase1-install.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-phase1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-and-verify:
    if: github.ref == 'refs/heads/app/ui-integration-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active app branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify scientific core still matches frozen reference
        shell: bash
        run: |
          git fetch origin freeze/scientific-backend-v3.1-2026-09-24
          git diff --exit-code origin/freeze/scientific-backend-v3.1-2026-09-24 -- src/cualni_cryst

      - name: Generate complete Phase 1 application package
        shell: python
        run: |
          from __future__ import annotations
          import base64
          import io
          import zipfile
          from pathlib import Path

          payload = ""
          root = Path.cwd().resolve()
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(payload))) as archive:
              for info in archive.infolist():
                  target = (root / info.filename).resolve()
                  if root not in target.parents and target != root:
                      raise RuntimeError(f"Unsafe archive path: {info.filename}")
              archive.extractall(root)

          print("Generated files:")
          for path in sorted([
              *Path("app").rglob("*.py"),
              *Path("tests/app").rglob("*.py"),
              Path("requirements.txt"),
              Path("pyproject.toml"),
              Path(".streamlit/config.toml"),
              Path("docs/app/PHASE1.md"),
          ]):
              print(" -", path)

      - name: Confirm generator did not modify scientific source
        shell: bash
        run: |
          git diff --exit-code origin/freeze/scientific-backend-v3.1-2026-09-24 -- src/cualni_cryst

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,app]"

      - name: Compile application layer
        run: |
          python -m compileall -q app tests/app

      - name: Run application contract and cross-lock tests
        run: |
          python -m pytest -vv tests/app/test_application_contract.py

      - name: Run Streamlit startup smoke test
        run: |
          python -m pytest -vv tests/app/test_streamlit_smoke.py

      - name: Run full scientific regression suite
        run: |
          python -m pytest -q

      - name: Reconfirm frozen scientific source is unchanged
        shell: bash
        run: |
          git diff --exit-code origin/freeze/scientific-backend-v3.1-2026-09-24 -- src/cualni_cryst

      - name: Commit Phase 1 only after every gate passes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests/app .streamlit docs/app requirements.txt pyproject.toml
          if git diff --cached --quiet; then
            echo "Phase 1 files already match the generated package."
            exit 0
          fi
          git commit -m "app: add validated phase 1 public crystallography workbench"
          git push origin HEAD:app/ui-integration-v1
