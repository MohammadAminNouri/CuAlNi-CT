name: Scientific Python checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    env:
      # Network hiccups on the package index must not make pip backtrack through
      # obsolete source-only scientific-package releases.
      PIP_DEFAULT_TIMEOUT: "60"
      PIP_RETRIES: "5"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install project
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Install attempt ${attempt}/3"
            if python -m pip install --prefer-binary -e ".[app,dev]"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::Project installation failed after three attempts."
              exit 1
            fi
            delay=$((attempt * 10))
            echo "::warning::Package installation failed; retrying in ${delay}s."
            sleep "${delay}"
          done

      - name: Verify environment
        run: |
          python -m pip check
          python - <<'PY'
          import numpy
          import pandas
          import scipy
          import sympy
          import streamlit
          print("numpy:", numpy.__version__)
          print("pandas:", pandas.__version__)
          print("scipy:", scipy.__version__)
          print("sympy:", sympy.__version__)
          print("streamlit:", streamlit.__version__)
          PY

      - name: Import package
        run: |
          python - <<'PY'
          import cualni_cryst
          print("cualni_cryst version:", cualni_cryst.__version__)
          PY

      - name: Run tests
        run: |
          python -m pytest -vv

      - name: Run symbolic reference
        run: |
          python -m cualni_cryst symbolic
